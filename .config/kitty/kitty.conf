# Font Configuration
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# Window Configuration
window_margin_width 4
single_window_margin_width 0
window_padding_width 2
background_opacity 0.8
# background_blur 32
hide_window_decorations no

# Cursor Configuration
# cursor_shape block
disable_ligatures cursor
cursor_blink_interval 1
cursor_trail 10
cursor_trail_decay 0.01 0.05

# LAYOUT
enabled_layouts tall,*

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# MAPPED KEYS
map ctrl+shift+enter new_window_with_cwd
# map F1 new_window_with_cwd
map ctrl+left neighboring_window left
map ctrl+down neighboring_window down
map ctrl+up neighboring_window up
map ctrl+right neighboring_window right
# map shift+down move_window up
# map shift+left move_window right
dynamic_background_opacity yes
map kitty_mod+p set_background_opacity +.1
map kitty_mod+m set_background_opacity -.1
map kitty_mod+g launch --stdin-source=@last_cmd_output --type=overlay nvim - 
map kitty_mod+y launch --stdin-source=@last_cmd_output --type=clipboard wl-copy
map ctrl+c copy_or_noop
map kitty_mod+f launch --type=os-window --cwd=current --copy-env=yes --os-window-class kitty:float

# Tab configuration
tab_bar_style powerline
tab_bar_align left
tab_bar_edge top

# Shell integration
shell_integration enabled

# --- Bell ---
enable_audio_bell no
visual_bell_duration 0.1
bell_on_tab 󱇥

# --- Window Layout ---
remember_window_size no

# --- Advanced ---
close_on_child_death yes
confirm_exit no
notify_on_cmd_finish unfocused 30 notify-bell
allow_remote_control yes

# color generation
include current-theme.conf
include open-actions.conf

